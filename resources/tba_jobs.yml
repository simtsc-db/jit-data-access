resources:
  jobs:
    tba_setup:
      name: ${var.name_prefix}-setup
      description: >
        Idempotent setup: synthetic sensitive data product, Lakebase approval store (tables, constraints,
        history trigger, app grants), governed tag, ABAC time-bound guard (row filter policy),
        group-level grants, optional DENY policy.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: catalog_storage_root
          default: ${var.catalog_storage_root}
        - name: control_schema
          default: ${var.control_schema}
        - name: data_schema
          default: ${var.data_schema}
        - name: eligible_group
          default: ${var.eligible_group}
        - name: standing_access_group
          default: ${var.standing_access_group}
        - name: owner_group
          default: ${var.owner_group}
        - name: app_sp_client_id
          default: ${resources.apps.access_portal.service_principal_client_id}
        - name: product_tag_key
          default: ${var.product_tag_key}
        - name: product_tag_value
          default: ${var.product_tag_value}
        - name: seed
          default: ${var.synthetic_seed}
        - name: rows
          default: ${var.synthetic_rows}
        - name: lakebase_project
          default: ${resources.postgres_projects.approval_store.project_id}
        - name: lakebase_catalog
          default: ${resources.postgres_catalogs.approval_store_catalog.catalog_id}
        - name: lakebase_schema
          default: ${var.lakebase_schema}
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../src/setup/01_generate_data.py
          environment_key: default
        - task_key: approval_store
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ../src/setup/02_approval_store.py
          environment_key: default
        - task_key: governance
          depends_on:
            - task_key: approval_store
          notebook_task:
            notebook_path: ../src/setup/03_governance.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.81
              - psycopg[binary]>=3.2

    tba_expiry:
      name: ${var.name_prefix}-expiry
      description: >
        Closes expired grants (ACTIVE -> EXPIRED), times out stale requests and logs each run.
        Enforcement does not depend on this job: the ABAC guard stops access at expires_at.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: ${var.expiry_cron}
        timezone_id: ${var.expiry_timezone}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: control_schema
          default: ${var.control_schema}
        - name: request_timeout_days
          default: ${var.request_timeout_days}
        - name: lakebase_project
          default: ${resources.postgres_projects.approval_store.project_id}
        - name: lakebase_schema
          default: ${var.lakebase_schema}
      tasks:
        - task_key: expire_access
          notebook_task:
            notebook_path: ../src/jobs/expire_access.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.81
              - psycopg[binary]>=3.2
